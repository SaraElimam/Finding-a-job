<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lombardy Architecture Firms</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Leaflet CSS and JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <style>
    body {
      font-family: 'Pixelify Sans', monospace;
      background-color: #f0f7fa;
      background-image: radial-gradient(#d5e8f0 1.5px, transparent 1.5px);
      background-size: 16px 16px;
      color: #303952;
    }
    .retro-box { border: 3px solid #303952; box-shadow: 4px 4px 0px #303952; }
    .retro-box-sm { border: 2px solid #303952; box-shadow: 2px 2px 0px #303952; }
    .retro-btn { transition: all 0.1s; }
    .retro-btn:active { transform: translate(2px, 2px); box-shadow: 0px 0px 0px #303952 !important; }
    .folder-tab { border-top: 3px solid #303952; border-left: 3px solid #303952; border-right: 3px solid #303952; }
    
    /* Customizing the map popup to match the aesthetic */
    .leaflet-popup-content-wrapper {
      background: #f5fbff;
      border: 2px solid #303952;
      border-radius: 8px;
      box-shadow: 2px 2px 0px #303952;
      color: #303952;
      font-family: 'Pixelify Sans', monospace;
    }
    .leaflet-popup-tip { background: #303952; }
  </style>
</head>
<body class="p-4 md:p-8 flex flex-col h-screen">

  <header class="max-w-7xl w-full mx-auto bg-[#e3f0f6] retro-box rounded-xl p-4 mb-6 shrink-0">
    <div class="flex items-center justify-between border-b-2 border-[#303952] pb-2">
      <div>
        <span class="text-[10px] tracking-wider uppercase bg-[#fff] px-2 py-0.5 rounded border border-[#303952]">Job Hunt Radar</span>
        <h1 class="text-xl font-bold tracking-wide mt-1">LOMBARDY ARCHITECTURE FIRMS</h1>
      </div>
      <div class="bg-[#fff] retro-box-sm rounded p-2 text-center px-4">
        <span class="block text-[10px] text-slate-400">TOTAL LOCATED</span>
        <span id="firm-count" class="text-lg font-bold text-pink-500">0</span>
      </div>
    </div>
  </header>

  <main class="max-w-7xl w-full mx-auto flex-1 flex flex-col md:flex-row gap-6 min-h-0">
    
    <!-- Sidebar List -->
    <div class="w-full md:w-1/3 flex flex-col min-h-0 relative">
      <div class="absolute top-0 left-4 folder-tab px-4 py-1 rounded-t-lg font-bold text-xs bg-[#ffd6e0] text-[#303952] z-10">
        Directory
      </div>
      <div class="bg-[#f5fbff] retro-box rounded-xl rounded-tl-none p-4 mt-6 flex-1 overflow-y-auto space-y-3" id="firm-list">
        <!-- Cards injected via JS -->
      </div>
    </div>

    <!-- Map Container -->
    <div class="w-full md:w-2/3 h-64 md:h-full bg-[#cce3f5] retro-box rounded-xl overflow-hidden relative z-0">
      <div id="map" class="w-full h-full"></div>
    </div>

  </main>

  <script>
    // Initialize map centered near Lecco 
    const map = L.map('map').setView([45.8566, 9.3977], 9);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    let firmData = [];

    fetch('firms.json')
      .then(res => res.json())
      .then(data => {
        firmData = data;
        document.getElementById('firm-count').innerText = data.length;
        renderData();
      })
      .catch(err => {
        document.getElementById('firm-list').innerHTML = '<div class="text-sm font-bold p-2 text-pink-600">Run the GitHub Action to generate firms.json!</div>';
      });

    function renderData() {
      const list = document.getElementById('firm-list');
      list.innerHTML = '';

      firmData.forEach((firm, index) => {
        // Add map marker
        const marker = L.marker([firm.lat, firm.lon]).addTo(map);
        
        let popupHtml = `<div class="p-1">
          <strong class="text-sm border-b-2 border-[#303952] block pb-1 mb-1">${firm.name}</strong>
          <p class="text-xs mb-1">📍 ${firm.address}</p>
          <p class="text-[10px]">${firm.phone !== 'N/A' ? '📞 ' + firm.phone : ''}</p>
        </div>`;
        
        if(firm.website && firm.website.startsWith('http')) {
           popupHtml += `<a href="${firm.website}" target="_blank" class="text-[10px] bg-[#ffd6e0] border border-[#303952] px-2 py-1 rounded inline-block mt-1 font-bold">Visit Website ↗</a>`;
        }
        marker.bindPopup(popupHtml);

        // Add sidebar card
        const card = document.createElement('div');
        card.className = 'bg-[#ffffff] retro-box-sm rounded-lg p-3 cursor-pointer retro-btn hover:bg-[#e3f0f6]';
        card.innerHTML = `
          <h3 class="font-bold text-sm leading-tight text-[#303952]">${firm.name}</h3>
          <p class="text-[10px] text-slate-500 mt-1 truncate">📍 ${firm.address}</p>
        `;
        
        card.onclick = () => {
          map.flyTo([firm.lat, firm.lon], 15, { duration: 1.5 });
          setTimeout(() => marker.openPopup(), 1500);
        };
        list.appendChild(card);
      });
    }
  </script>
</body>
</html>
