name: Update Architecture Firms

on:
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    # This is the fix: explicitly granting the bot write access
    permissions:
      contents: write
      
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run data fetcher
        run: python fetch_firms.py

      - name: Commit and push JSON
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add firms.json
          git commit -m "Auto-update Lombardy architectural firms" || echo "No changes to commit"
          git push
